#  oc adm policy add-cluster-role-to-user cluster-monitoring-view -z sreips-runner-service-account -n sreips-core
#  oc create token sreips-runner-service-account -n sreips-core --duration=8760h
##### update the token in the playbook config secret with the above command output and uncomment the globalConfig section below to enable prometheus queries in the playbooks    
# globalConfig:
#       prometheus_url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
#       prometheus_auth: "Bearer <INSERT_YOUR_TOKEN_HERE>"
# restart the sreips-runner deployment after updating the secret to pick up the new token value. You can do this by running:
# oc rollout restart deployment/sreips-runner -n sreips-core
###
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  name: gradual-memory-leaks
  namespace: failure-test
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gradual-memory-leak
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: gradual-memory-leak
    spec:
      containers:
      - command:
        - python
        - -c
        - "import time\nimport sys\nprint(\"Starting gradual memory leak simulation...\",
          flush=True)\nleak_storage = []\nchunk_size = 30 * 1024 * 1024  \nwhile True:\n
          \   try:\n        leak_storage.append(bytearray(chunk_size))\n        print(f\"Allocated
          another 30MB. Total blocks: {len(leak_storage)}\", flush=True)\n        time.sleep(5)\n
          \   except MemoryError:\n        print(\"Python reached memory limits!\",
          flush=True)\n        sys.exit(1)\n"
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        name: leaker
        resources:
          limits:
            memory: 150Mi
          requests:
            memory: 50Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
