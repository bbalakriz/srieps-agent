# PIPELINE DEFINITION
# Name: docling-convert-pipeline
# Description: Converts PDF documents in a git repository to Markdown using Docling and generates embeddings
# Inputs:
#    base_url: str [Default: 'https://raw.githubusercontent.com/bbalakriz/rh-kcs-mcp/master']
#    embed_model_id: str [Default: 'ibm-granite/granite-embedding-125m-english']
#    max_tokens: int [Default: 512.0]
#    num_workers: int [Default: 1.0]
#    pdf_filenames: str [Default: 'SREIPS-Prod-troubleshooting-Knowledge-Base.pdf']
#    service_url: str [Default: 'http://lsd-llama-milvus-service:8321']
#    use_gpu: bool [Default: False]
#    vector_db_id: str [Default: 'sreips_vector_id']
components:
  comp-condition-3:
    dag:
      tasks:
        docling-convert:
          cachingOptions: {}
          componentRef:
            name: comp-docling-convert
          inputs:
            artifacts:
              input_path:
                componentInputArtifact: pipelinechannel--import-test-pdfs-output_path
            parameters:
              embed_model_id:
                componentInputParameter: pipelinechannel--embed_model_id
              max_tokens:
                componentInputParameter: pipelinechannel--max_tokens
              pdf_split:
                componentInputParameter: pipelinechannel--create-pdf-splits-Output-loop-item
              service_url:
                componentInputParameter: pipelinechannel--service_url
              vector_store_id:
                componentInputParameter: pipelinechannel--register-vector-db-Output
          taskInfo:
            name: docling-convert
    inputDefinitions:
      artifacts:
        pipelinechannel--import-test-pdfs-output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--create-pdf-splits-Output-loop-item:
          parameterType: LIST
        pipelinechannel--embed_model_id:
          parameterType: STRING
        pipelinechannel--max_tokens:
          parameterType: NUMBER_INTEGER
        pipelinechannel--register-vector-db-Output:
          parameterType: STRING
        pipelinechannel--service_url:
          parameterType: STRING
        pipelinechannel--use_gpu:
          parameterType: BOOLEAN
  comp-condition-4:
    dag:
      tasks:
        docling-convert-2:
          cachingOptions: {}
          componentRef:
            name: comp-docling-convert-2
          inputs:
            artifacts:
              input_path:
                componentInputArtifact: pipelinechannel--import-test-pdfs-output_path
            parameters:
              embed_model_id:
                componentInputParameter: pipelinechannel--embed_model_id
              max_tokens:
                componentInputParameter: pipelinechannel--max_tokens
              pdf_split:
                componentInputParameter: pipelinechannel--create-pdf-splits-Output-loop-item
              service_url:
                componentInputParameter: pipelinechannel--service_url
              vector_store_id:
                componentInputParameter: pipelinechannel--register-vector-db-Output
          taskInfo:
            name: docling-convert-2
    inputDefinitions:
      artifacts:
        pipelinechannel--import-test-pdfs-output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--create-pdf-splits-Output-loop-item:
          parameterType: LIST
        pipelinechannel--embed_model_id:
          parameterType: STRING
        pipelinechannel--max_tokens:
          parameterType: NUMBER_INTEGER
        pipelinechannel--register-vector-db-Output:
          parameterType: STRING
        pipelinechannel--service_url:
          parameterType: STRING
        pipelinechannel--use_gpu:
          parameterType: BOOLEAN
  comp-condition-branches-2:
    dag:
      tasks:
        condition-3:
          componentRef:
            name: comp-condition-3
          inputs:
            artifacts:
              pipelinechannel--import-test-pdfs-output_path:
                componentInputArtifact: pipelinechannel--import-test-pdfs-output_path
            parameters:
              pipelinechannel--create-pdf-splits-Output-loop-item:
                componentInputParameter: pipelinechannel--create-pdf-splits-Output-loop-item
              pipelinechannel--embed_model_id:
                componentInputParameter: pipelinechannel--embed_model_id
              pipelinechannel--max_tokens:
                componentInputParameter: pipelinechannel--max_tokens
              pipelinechannel--register-vector-db-Output:
                componentInputParameter: pipelinechannel--register-vector-db-Output
              pipelinechannel--service_url:
                componentInputParameter: pipelinechannel--service_url
              pipelinechannel--use_gpu:
                componentInputParameter: pipelinechannel--use_gpu
          taskInfo:
            name: condition-3
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--use_gpu'] == true
        condition-4:
          componentRef:
            name: comp-condition-4
          inputs:
            artifacts:
              pipelinechannel--import-test-pdfs-output_path:
                componentInputArtifact: pipelinechannel--import-test-pdfs-output_path
            parameters:
              pipelinechannel--create-pdf-splits-Output-loop-item:
                componentInputParameter: pipelinechannel--create-pdf-splits-Output-loop-item
              pipelinechannel--embed_model_id:
                componentInputParameter: pipelinechannel--embed_model_id
              pipelinechannel--max_tokens:
                componentInputParameter: pipelinechannel--max_tokens
              pipelinechannel--register-vector-db-Output:
                componentInputParameter: pipelinechannel--register-vector-db-Output
              pipelinechannel--service_url:
                componentInputParameter: pipelinechannel--service_url
              pipelinechannel--use_gpu:
                componentInputParameter: pipelinechannel--use_gpu
          taskInfo:
            name: condition-4
          triggerPolicy:
            condition: '!(inputs.parameter_values[''pipelinechannel--use_gpu''] ==
              true)'
    inputDefinitions:
      artifacts:
        pipelinechannel--import-test-pdfs-output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--create-pdf-splits-Output-loop-item:
          parameterType: LIST
        pipelinechannel--embed_model_id:
          parameterType: STRING
        pipelinechannel--max_tokens:
          parameterType: NUMBER_INTEGER
        pipelinechannel--register-vector-db-Output:
          parameterType: STRING
        pipelinechannel--service_url:
          parameterType: STRING
        pipelinechannel--use_gpu:
          parameterType: BOOLEAN
  comp-create-pdf-splits:
    executorLabel: exec-create-pdf-splits
    inputDefinitions:
      artifacts:
        input_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        num_splits:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: LIST
  comp-docling-convert:
    executorLabel: exec-docling-convert
    inputDefinitions:
      artifacts:
        input_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        embed_model_id:
          parameterType: STRING
        max_tokens:
          parameterType: NUMBER_INTEGER
        pdf_split:
          parameterType: LIST
        service_url:
          parameterType: STRING
        vector_store_id:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-docling-convert-2:
    executorLabel: exec-docling-convert-2
    inputDefinitions:
      artifacts:
        input_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        embed_model_id:
          parameterType: STRING
        max_tokens:
          parameterType: NUMBER_INTEGER
        pdf_split:
          parameterType: LIST
        service_url:
          parameterType: STRING
        vector_store_id:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-for-loop-1:
    dag:
      tasks:
        condition-branches-2:
          componentRef:
            name: comp-condition-branches-2
          inputs:
            artifacts:
              pipelinechannel--import-test-pdfs-output_path:
                componentInputArtifact: pipelinechannel--import-test-pdfs-output_path
            parameters:
              pipelinechannel--create-pdf-splits-Output-loop-item:
                componentInputParameter: pipelinechannel--create-pdf-splits-Output-loop-item
              pipelinechannel--embed_model_id:
                componentInputParameter: pipelinechannel--embed_model_id
              pipelinechannel--max_tokens:
                componentInputParameter: pipelinechannel--max_tokens
              pipelinechannel--register-vector-db-Output:
                componentInputParameter: pipelinechannel--register-vector-db-Output
              pipelinechannel--service_url:
                componentInputParameter: pipelinechannel--service_url
              pipelinechannel--use_gpu:
                componentInputParameter: pipelinechannel--use_gpu
          taskInfo:
            name: condition-branches-2
    inputDefinitions:
      artifacts:
        pipelinechannel--import-test-pdfs-output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--create-pdf-splits-Output:
          parameterType: LIST
        pipelinechannel--create-pdf-splits-Output-loop-item:
          parameterType: LIST
        pipelinechannel--embed_model_id:
          parameterType: STRING
        pipelinechannel--max_tokens:
          parameterType: NUMBER_INTEGER
        pipelinechannel--register-vector-db-Output:
          parameterType: STRING
        pipelinechannel--service_url:
          parameterType: STRING
        pipelinechannel--use_gpu:
          parameterType: BOOLEAN
  comp-import-test-pdfs:
    executorLabel: exec-import-test-pdfs
    inputDefinitions:
      parameters:
        base_url:
          parameterType: STRING
        pdf_filenames:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-register-vector-db:
    executorLabel: exec-register-vector-db
    inputDefinitions:
      parameters:
        embed_model_id:
          parameterType: STRING
        service_url:
          parameterType: STRING
        vector_db_id:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-create-pdf-splits:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - create_pdf_splits
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef create_pdf_splits(\n    input_path: dsl.InputPath(\"input-pdfs\"\
          ),\n    num_splits: int,\n) -> List[List[str]]:\n    import pathlib\n\n\
          \    print(f\"Creating up to {num_splits} splits from PDFs in {input_path}\"\
          )\n    # Split our entire directory of pdfs into n batches, where n == num_splits\n\
          \    all_pdfs = [\n        str(path.relative_to(input_path))\n        for\
          \ path in pathlib.Path(input_path).rglob(\"*\")\n        if path.suffix.lower()\
          \ == \".pdf\"\n    ]\n\n    print(f\"Found PDFs for processing:\" , all_pdfs)\n\
          \n    splits = [\n        batch for batch in (all_pdfs[i::num_splits] for\
          \ i in range(num_splits)) if batch\n    ]\n    return splits or [[]]\n\n"
        image: quay.io/balki404/docling-pipeline:0.0.7
    exec-docling-convert:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - docling_convert
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef docling_convert(\n    input_path: dsl.InputPath(\"input-pdfs\"\
          ),\n    pdf_split: List[str],\n    output_path: dsl.OutputPath(\"output-md\"\
          ),\n    embed_model_id: str,\n    max_tokens: int,\n    service_url: str,\n\
          \    vector_store_id: str,\n):\n    import os\n    import pathlib\n    import\
          \ hashlib\n    import json\n    import logging\n    from typing import List\n\
          \n    # baked in image; offline + artifacts_path avoids HF writes at runtime\n\
          \    hf_cache = \"/opt/app-root/model-cache/huggingface\"\n    st_cache\
          \ = \"/opt/app-root/model-cache/sentence-transformers\"\n    docling_artifacts\
          \ = \"/opt/app-root/model-cache/docling\"\n    os.environ[\"HF_HOME\"] =\
          \ hf_cache\n    os.environ[\"TRANSFORMERS_CACHE\"] = hf_cache\n    os.environ[\"\
          HUGGINGFACE_HUB_CACHE\"] = hf_cache\n    os.environ[\"SENTENCE_TRANSFORMERS_HOME\"\
          ] = st_cache\n    os.environ[\"DOCLING_ARTIFACTS_PATH\"] = docling_artifacts\n\
          \    os.environ[\"HF_HUB_OFFLINE\"] = \"1\"\n    os.environ[\"TRANSFORMERS_OFFLINE\"\
          ] = \"1\"\n\n    from docling.datamodel.base_models import InputFormat,\
          \ ConversionStatus\n    from docling.datamodel.pipeline_options import PdfPipelineOptions,\
          \ RapidOcrOptions\n    from docling.document_converter import DocumentConverter,\
          \ PdfFormatOption\n    from transformers import AutoTokenizer\n    from\
          \ sentence_transformers import SentenceTransformer\n    from docling.chunking\
          \ import HybridChunker\n    from llama_stack_client import LlamaStackClient\n\
          \n    def setup_rapidocr_options() -> RapidOcrOptions:\n        rapidocr_dir\
          \ = os.environ.get(\n            \"RAPIDOCR_MODEL_DIR\", \"/opt/app-root/model-cache/rapidocr\"\
          \n        )\n        os.makedirs(rapidocr_dir, exist_ok=True)\n        root\
          \ = pathlib.Path(rapidocr_dir)\n\n        def first_match(*patterns: str)\
          \ -> str | None:\n            for pattern in patterns:\n               \
          \ matches = sorted(root.rglob(pattern))\n                if matches:\n \
          \                   return str(matches[0])\n            return None\n\n\
          \        det = first_match(\"ch_PP-OCRv4_det_mobile.onnx\", \"*det*.onnx\"\
          )\n        cls = first_match(\"ch_ppocr_mobile_v2.0_cls_infer.onnx\", \"\
          *cls*.onnx\")\n        rec = first_match(\"ch_PP-OCRv4_rec_mobile_infer.onnx\"\
          , \"*rec*.onnx\")\n        keys = first_match(\"*dict*.txt\", \"*keys*.txt\"\
          )\n\n        kwargs: dict = {}\n        if det:\n            kwargs[\"det_model_path\"\
          ] = det\n        if cls:\n            kwargs[\"cls_model_path\"] = cls\n\
          \        if rec:\n            kwargs[\"rec_model_path\"] = rec\n       \
          \ if keys:\n            kwargs[\"rec_keys_path\"] = keys\n        if not\
          \ kwargs:\n            kwargs[\"rapidocr_params\"] = {\"Global.model_root_dir\"\
          : rapidocr_dir}\n        return RapidOcrOptions(**kwargs)\n\n    _log =\
          \ logging.getLogger(__name__)\n\n    def setup_chunker_and_embedder(embed_model_id:\
          \ str, max_tokens: int):  \n        \"\"\"Initialize the custom chunker\
          \ and embedding model\"\"\"  \n        tokenizer = AutoTokenizer.from_pretrained(\n\
          \            embed_model_id, local_files_only=True\n        )\n        embedding_model\
          \ = SentenceTransformer(embed_model_id)  \n        chunker = HybridChunker(\
          \  \n            tokenizer=tokenizer, max_tokens=max_tokens, merge_peers=True\
          \  \n        )  \n        return embedding_model, chunker  \n\n    def embed_text(text:\
          \ str, embedding_model) -> List[float]:  \n        \"\"\"Generate embedding\
          \ for text using the custom model\"\"\"  \n        return embedding_model.encode([text],\
          \ normalize_embeddings=True).tolist()[0]  \n\n    def resolve_stack_embedding_model(client,\
          \ provider_embed_id: str) -> tuple[str, int]:\n        for m in client.models.list():\n\
          \            md = m.custom_metadata or {}\n            if md.get(\"model_type\"\
          ) != \"embedding\":\n                continue\n            if md.get(\"\
          provider_resource_id\") == provider_embed_id or m.id.endswith(\n       \
          \         \"/\" + provider_embed_id\n            ):\n                return\
          \ m.id, int(md.get(\"embedding_dimension\", 768))\n        raise ValueError(f\"\
          Embedding model '{provider_embed_id}' not found on LlamaStack\")\n\n   \
          \ def process_and_insert_with_custom_chunking(\n        conv_results,\n\
          \        vector_store_id: str,\n        embed_model_id: str,\n        max_tokens:\
          \ int = 512,\n        batch_size: int = 32,\n    ):\n        \"\"\"Process\
          \ documents using custom chunker and precomputed embeddings.\"\"\"\n   \
          \     processed_docs = 0\n        client = LlamaStackClient(base_url=service_url)\n\
          \        stack_model_id, embedding_dim = resolve_stack_embedding_model(client,\
          \ embed_model_id)\n        embedding_model, chunker = setup_chunker_and_embedder(embed_model_id,\
          \ max_tokens)\n\n        for conv_res in conv_results:\n            file_name\
          \ = conv_res.input.file.stem\n\n            if conv_res.status != ConversionStatus.SUCCESS:\n\
          \                _log.warning(f\"Conversion failed for {file_name}: {conv_res.status}\"\
          )\n                continue\n\n            document = conv_res.document\n\
          \            if document is None:\n                _log.warning(f\"Document\
          \ conversion returned None for {file_name}\")\n                continue\n\
          \n            processed_docs += 1\n            chunks = []\n\n         \
          \   for chunk in chunker.chunk(dl_doc=document):\n                if chunk\
          \ is None:\n                    continue\n\n                raw_chunk =\
          \ chunker.contextualize(chunk)\n                if not raw_chunk or not\
          \ raw_chunk.strip():\n                    continue\n\n                chunk_id\
          \ = hashlib.sha256(f\"{file_name}:{raw_chunk}\".encode()).hexdigest()\n\
          \                chunks.append(\n                    {\n               \
          \         \"chunk_id\": chunk_id,\n                        \"content\":\
          \ raw_chunk,\n                        \"chunk_metadata\": {\n          \
          \                  \"document_id\": file_name,\n                       \
          \     \"file_name\": file_name,\n                            \"chunk_id\"\
          : chunk_id,\n                            \"source\": \"docling_hybrid_chunker\"\
          ,\n                        },\n                        \"embedding\": embed_text(raw_chunk,\
          \ embedding_model),\n                        \"embedding_model\": stack_model_id,\n\
          \                        \"embedding_dimension\": embedding_dim,\n     \
          \               }\n                )\n\n            if not chunks:\n   \
          \             continue\n\n            try:\n                for i in range(0,\
          \ len(chunks), batch_size):\n                    client.vector_io.insert(\n\
          \                        vector_store_id=vector_store_id,\n            \
          \            chunks=chunks[i : i + batch_size],\n                    )\n\
          \                _log.info(f\"Inserted {len(chunks)} chunks for {file_name}\"\
          )\n            except Exception as e:\n                _log.error(f\"Failed\
          \ to insert chunks for {file_name}: {e}\")\n\n        _log.info(f\"Processed\
          \ {processed_docs} documents successfully.\")\n\n    # Main logic starts\
          \ here\n    input_path = pathlib.Path(input_path)\n    output_path = pathlib.Path(output_path)\n\
          \    output_path.mkdir(parents=True, exist_ok=True)\n\n    # Build absolute\
          \ paths for the PDFs\n    input_pdfs = list(input_path.rglob(\"*.pdf\"))\n\
          \n    # Ensure only valid, non-empty PDFs are kept\n    input_pdfs = [p\
          \ for p in input_pdfs if p.exists() and p.stat().st_size > 0]\n\n    if\
          \ not input_pdfs:\n        raise RuntimeError(\"No valid PDFs found in input_path\
          \ for processing.\")\n\n    pipeline_options = PdfPipelineOptions(artifacts_path=docling_artifacts)\n\
          \    pipeline_options.do_ocr = True\n    pipeline_options.generate_page_images\
          \ = True\n    pipeline_options.ocr_options = setup_rapidocr_options()\n\n\
          \    doc_converter = DocumentConverter(\n        format_options={\n    \
          \        InputFormat.PDF: PdfFormatOption(pipeline_options=pipeline_options)\n\
          \        }\n    )\n\n    print(\"PDFs for conversion:\")\n    for p in input_pdfs:\n\
          \        print(f\" - {p} (exists={p.exists()}, size={p.stat().st_size if\
          \ p.exists() else 'N/A'})\")\n\n    conv_results = doc_converter.convert_all(\n\
          \        input_pdfs,\n        raises_on_error=True,\n    )\n\n    # Process\
          \ the conversion results and insert embeddings into the vector database\n\
          \    process_and_insert_with_custom_chunking( conv_results=conv_results,\
          \  \n        vector_store_id=vector_store_id,  \n        embed_model_id=embed_model_id,\
          \  \n        max_tokens=512)\n\n"
        image: quay.io/balki404/docling-pipeline:0.0.7
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
            resourceType: nvidia.com/gpu
            type: nvidia.com/gpu
          cpuLimit: 4.0
          cpuRequest: 0.5
          memoryLimit: 6.442450944
          memoryRequest: 2.147483648
          resourceCpuLimit: '4'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 6Gi
          resourceMemoryRequest: 2Gi
    exec-docling-convert-2:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - docling_convert
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef docling_convert(\n    input_path: dsl.InputPath(\"input-pdfs\"\
          ),\n    pdf_split: List[str],\n    output_path: dsl.OutputPath(\"output-md\"\
          ),\n    embed_model_id: str,\n    max_tokens: int,\n    service_url: str,\n\
          \    vector_store_id: str,\n):\n    import os\n    import pathlib\n    import\
          \ hashlib\n    import json\n    import logging\n    from typing import List\n\
          \n    # baked in image; offline + artifacts_path avoids HF writes at runtime\n\
          \    hf_cache = \"/opt/app-root/model-cache/huggingface\"\n    st_cache\
          \ = \"/opt/app-root/model-cache/sentence-transformers\"\n    docling_artifacts\
          \ = \"/opt/app-root/model-cache/docling\"\n    os.environ[\"HF_HOME\"] =\
          \ hf_cache\n    os.environ[\"TRANSFORMERS_CACHE\"] = hf_cache\n    os.environ[\"\
          HUGGINGFACE_HUB_CACHE\"] = hf_cache\n    os.environ[\"SENTENCE_TRANSFORMERS_HOME\"\
          ] = st_cache\n    os.environ[\"DOCLING_ARTIFACTS_PATH\"] = docling_artifacts\n\
          \    os.environ[\"HF_HUB_OFFLINE\"] = \"1\"\n    os.environ[\"TRANSFORMERS_OFFLINE\"\
          ] = \"1\"\n\n    from docling.datamodel.base_models import InputFormat,\
          \ ConversionStatus\n    from docling.datamodel.pipeline_options import PdfPipelineOptions,\
          \ RapidOcrOptions\n    from docling.document_converter import DocumentConverter,\
          \ PdfFormatOption\n    from transformers import AutoTokenizer\n    from\
          \ sentence_transformers import SentenceTransformer\n    from docling.chunking\
          \ import HybridChunker\n    from llama_stack_client import LlamaStackClient\n\
          \n    def setup_rapidocr_options() -> RapidOcrOptions:\n        rapidocr_dir\
          \ = os.environ.get(\n            \"RAPIDOCR_MODEL_DIR\", \"/opt/app-root/model-cache/rapidocr\"\
          \n        )\n        os.makedirs(rapidocr_dir, exist_ok=True)\n        root\
          \ = pathlib.Path(rapidocr_dir)\n\n        def first_match(*patterns: str)\
          \ -> str | None:\n            for pattern in patterns:\n               \
          \ matches = sorted(root.rglob(pattern))\n                if matches:\n \
          \                   return str(matches[0])\n            return None\n\n\
          \        det = first_match(\"ch_PP-OCRv4_det_mobile.onnx\", \"*det*.onnx\"\
          )\n        cls = first_match(\"ch_ppocr_mobile_v2.0_cls_infer.onnx\", \"\
          *cls*.onnx\")\n        rec = first_match(\"ch_PP-OCRv4_rec_mobile_infer.onnx\"\
          , \"*rec*.onnx\")\n        keys = first_match(\"*dict*.txt\", \"*keys*.txt\"\
          )\n\n        kwargs: dict = {}\n        if det:\n            kwargs[\"det_model_path\"\
