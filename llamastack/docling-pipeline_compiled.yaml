# PIPELINE DEFINITION
# Name: docling-convert-pipeline
# Description: Converts PDF documents in a git repository to Markdown using Docling and generates embeddings
# Inputs:
#    base_url: str [Default: 'https://raw.githubusercontent.com/bbalakriz/rh-kcs-mcp/master']
#    embed_model_id: str [Default: 'ibm-granite/granite-embedding-125m-english']
#    max_tokens: int [Default: 512.0]
#    num_workers: int [Default: 1.0]
#    pdf_filenames: str [Default: 'SREIPS-Prod-troubleshooting-Knowledge-Base.pdf']
#    service_url: str [Default: 'http://lsd-llama-milvus-service:8321']
#    use_gpu: bool [Default: False]
#    vector_db_id: str [Default: 'sreips_vector_id']
components:
  comp-condition-3:
    dag:
      tasks:
        docling-convert:
          cachingOptions: {}
          componentRef:
            name: comp-docling-convert
          inputs:
            artifacts:
              input_path:
                componentInputArtifact: pipelinechannel--import-test-pdfs-output_path
            parameters:
              embed_model_id:
                componentInputParameter: pipelinechannel--embed_model_id
              max_tokens:
                componentInputParameter: pipelinechannel--max_tokens
              pdf_split:
                componentInputParameter: pipelinechannel--create-pdf-splits-Output-loop-item
              service_url:
                componentInputParameter: pipelinechannel--service_url
              vector_store_id:
                componentInputParameter: pipelinechannel--register-vector-db-Output
          taskInfo:
            name: docling-convert
    inputDefinitions:
      artifacts:
        pipelinechannel--import-test-pdfs-output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--create-pdf-splits-Output-loop-item:
          parameterType: LIST
        pipelinechannel--embed_model_id:
          parameterType: STRING
        pipelinechannel--max_tokens:
          parameterType: NUMBER_INTEGER
        pipelinechannel--register-vector-db-Output:
          parameterType: STRING
        pipelinechannel--service_url:
          parameterType: STRING
        pipelinechannel--use_gpu:
          parameterType: BOOLEAN
  comp-condition-4:
    dag:
      tasks:
        docling-convert-2:
          cachingOptions: {}
          componentRef:
            name: comp-docling-convert-2
          inputs:
            artifacts:
              input_path:
                componentInputArtifact: pipelinechannel--import-test-pdfs-output_path
            parameters:
              embed_model_id:
                componentInputParameter: pipelinechannel--embed_model_id
              max_tokens:
                componentInputParameter: pipelinechannel--max_tokens
              pdf_split:
                componentInputParameter: pipelinechannel--create-pdf-splits-Output-loop-item
              service_url:
                componentInputParameter: pipelinechannel--service_url
              vector_store_id:
                componentInputParameter: pipelinechannel--register-vector-db-Output
          taskInfo:
            name: docling-convert-2
    inputDefinitions:
      artifacts:
        pipelinechannel--import-test-pdfs-output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--create-pdf-splits-Output-loop-item:
          parameterType: LIST
        pipelinechannel--embed_model_id:
          parameterType: STRING
        pipelinechannel--max_tokens:
          parameterType: NUMBER_INTEGER
        pipelinechannel--register-vector-db-Output:
          parameterType: STRING
        pipelinechannel--service_url:
          parameterType: STRING
        pipelinechannel--use_gpu:
          parameterType: BOOLEAN
  comp-condition-branches-2:
    dag:
      tasks:
        condition-3:
          componentRef:
            name: comp-condition-3
          inputs:
            artifacts:
              pipelinechannel--import-test-pdfs-output_path:
                componentInputArtifact: pipelinechannel--import-test-pdfs-output_path
            parameters:
              pipelinechannel--create-pdf-splits-Output-loop-item:
                componentInputParameter: pipelinechannel--create-pdf-splits-Output-loop-item
              pipelinechannel--embed_model_id:
                componentInputParameter: pipelinechannel--embed_model_id
              pipelinechannel--max_tokens:
                componentInputParameter: pipelinechannel--max_tokens
              pipelinechannel--register-vector-db-Output:
                componentInputParameter: pipelinechannel--register-vector-db-Output
              pipelinechannel--service_url:
                componentInputParameter: pipelinechannel--service_url
              pipelinechannel--use_gpu:
                componentInputParameter: pipelinechannel--use_gpu
          taskInfo:
            name: condition-3
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--use_gpu'] == true
        condition-4:
          componentRef:
            name: comp-condition-4
          inputs:
            artifacts:
              pipelinechannel--import-test-pdfs-output_path:
                componentInputArtifact: pipelinechannel--import-test-pdfs-output_path
            parameters:
              pipelinechannel--create-pdf-splits-Output-loop-item:
                componentInputParameter: pipelinechannel--create-pdf-splits-Output-loop-item
              pipelinechannel--embed_model_id:
                componentInputParameter: pipelinechannel--embed_model_id
              pipelinechannel--max_tokens:
                componentInputParameter: pipelinechannel--max_tokens
              pipelinechannel--register-vector-db-Output:
                componentInputParameter: pipelinechannel--register-vector-db-Output
              pipelinechannel--service_url:
                componentInputParameter: pipelinechannel--service_url
              pipelinechannel--use_gpu:
                componentInputParameter: pipelinechannel--use_gpu
          taskInfo:
            name: condition-4
          triggerPolicy:
            condition: '!(inputs.parameter_values[''pipelinechannel--use_gpu''] ==
              true)'
    inputDefinitions:
      artifacts:
        pipelinechannel--import-test-pdfs-output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--create-pdf-splits-Output-loop-item:
          parameterType: LIST
        pipelinechannel--embed_model_id:
          parameterType: STRING
        pipelinechannel--max_tokens:
          parameterType: NUMBER_INTEGER
        pipelinechannel--register-vector-db-Output:
          parameterType: STRING
        pipelinechannel--service_url:
          parameterType: STRING
        pipelinechannel--use_gpu:
          parameterType: BOOLEAN
  comp-create-pdf-splits:
    executorLabel: exec-create-pdf-splits
    inputDefinitions:
      artifacts:
        input_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
