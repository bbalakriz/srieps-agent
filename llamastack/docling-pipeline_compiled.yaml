          \        if rec:\n            kwargs[\"rec_model_path\"] = rec\n       \
          \ if keys:\n            kwargs[\"rec_keys_path\"] = keys\n        if not\
          \ kwargs:\n            kwargs[\"rapidocr_params\"] = {\"Global.model_root_dir\"\
          : rapidocr_dir}\n        return RapidOcrOptions(**kwargs)\n\n    _log =\
          \ logging.getLogger(__name__)\n\n    def setup_chunker_and_embedder(embed_model_id:\
          \ str, max_tokens: int):  \n        \"\"\"Initialize the custom chunker\
          \ and embedding model\"\"\"  \n        tokenizer = AutoTokenizer.from_pretrained(\n\
          \            embed_model_id, local_files_only=True\n        )\n        embedding_model\
          \ = SentenceTransformer(embed_model_id)  \n        chunker = HybridChunker(\
          \  \n            tokenizer=tokenizer, max_tokens=max_tokens, merge_peers=True\
          \  \n        )  \n        return embedding_model, chunker  \n\n    def embed_text(text:\
          \ str, embedding_model) -> List[float]:  \n        \"\"\"Generate embedding\
          \ for text using the custom model\"\"\"  \n        return embedding_model.encode([text],\
          \ normalize_embeddings=True).tolist()[0]  \n\n    def resolve_stack_embedding_model(client,\
          \ provider_embed_id: str) -> tuple[str, int]:\n        for m in client.models.list():\n\
          \            md = m.custom_metadata or {}\n            if md.get(\"model_type\"\
          ) != \"embedding\":\n                continue\n            if md.get(\"\
          provider_resource_id\") == provider_embed_id or m.id.endswith(\n       \
          \         \"/\" + provider_embed_id\n            ):\n                return\
          \ m.id, int(md.get(\"embedding_dimension\", 768))\n        raise ValueError(f\"\
          Embedding model '{provider_embed_id}' not found on LlamaStack\")\n\n   \
          \ def process_and_insert_with_custom_chunking(\n        conv_results,\n\
          \        vector_store_id: str,\n        embed_model_id: str,\n        max_tokens:\
          \ int = 512,\n        batch_size: int = 32,\n    ):\n        \"\"\"Process\
          \ documents using custom chunker and precomputed embeddings.\"\"\"\n   \
          \     processed_docs = 0\n        client = LlamaStackClient(base_url=service_url)\n\
          \        stack_model_id, embedding_dim = resolve_stack_embedding_model(client,\
          \ embed_model_id)\n        embedding_model, chunker = setup_chunker_and_embedder(embed_model_id,\
          \ max_tokens)\n\n        for conv_res in conv_results:\n            file_name\
          \ = conv_res.input.file.stem\n\n            if conv_res.status != ConversionStatus.SUCCESS:\n\
          \                _log.warning(f\"Conversion failed for {file_name}: {conv_res.status}\"\
          )\n                continue\n\n            document = conv_res.document\n\
          \            if document is None:\n                _log.warning(f\"Document\
          \ conversion returned None for {file_name}\")\n                continue\n\
          \n            processed_docs += 1\n            chunks = []\n\n         \
          \   for chunk in chunker.chunk(dl_doc=document):\n                if chunk\
          \ is None:\n                    continue\n\n                raw_chunk =\
          \ chunker.contextualize(chunk)\n                if not raw_chunk or not\
          \ raw_chunk.strip():\n                    continue\n\n                chunk_id\
          \ = hashlib.sha256(f\"{file_name}:{raw_chunk}\".encode()).hexdigest()\n\
          \                chunks.append(\n                    {\n               \
          \         \"chunk_id\": chunk_id,\n                        \"content\":\
          \ raw_chunk,\n                        \"chunk_metadata\": {\n          \
          \                  \"document_id\": file_name,\n                       \
          \     \"file_name\": file_name,\n                            \"chunk_id\"\
          : chunk_id,\n                            \"source\": \"docling_hybrid_chunker\"\
          ,\n                        },\n                        \"embedding\": embed_text(raw_chunk,\
          \ embedding_model),\n                        \"embedding_model\": stack_model_id,\n\
          \                        \"embedding_dimension\": embedding_dim,\n     \
          \               }\n                )\n\n            if not chunks:\n   \
          \             continue\n\n            try:\n                for i in range(0,\
          \ len(chunks), batch_size):\n                    client.vector_io.insert(\n\
          \                        vector_store_id=vector_store_id,\n            \
          \            chunks=chunks[i : i + batch_size],\n                    )\n\
          \                _log.info(f\"Inserted {len(chunks)} chunks for {file_name}\"\
          )\n            except Exception as e:\n                _log.error(f\"Failed\
          \ to insert chunks for {file_name}: {e}\")\n\n        _log.info(f\"Processed\
          \ {processed_docs} documents successfully.\")\n\n    # Main logic starts\
          \ here\n    input_path = pathlib.Path(input_path)\n    output_path = pathlib.Path(output_path)\n\
          \    output_path.mkdir(parents=True, exist_ok=True)\n\n    # Build absolute\
          \ paths for the PDFs\n    input_pdfs = list(input_path.rglob(\"*.pdf\"))\n\
          \n    # Ensure only valid, non-empty PDFs are kept\n    input_pdfs = [p\
          \ for p in input_pdfs if p.exists() and p.stat().st_size > 0]\n\n    if\
          \ not input_pdfs:\n        raise RuntimeError(\"No valid PDFs found in input_path\
          \ for processing.\")\n\n    pipeline_options = PdfPipelineOptions(artifacts_path=docling_artifacts)\n\
          \    pipeline_options.do_ocr = True\n    pipeline_options.generate_page_images\
          \ = True\n    pipeline_options.ocr_options = setup_rapidocr_options()\n\n\
          \    doc_converter = DocumentConverter(\n        format_options={\n    \
          \        InputFormat.PDF: PdfFormatOption(pipeline_options=pipeline_options)\n\
          \        }\n    )\n\n    print(\"PDFs for conversion:\")\n    for p in input_pdfs:\n\
          \        print(f\" - {p} (exists={p.exists()}, size={p.stat().st_size if\
          \ p.exists() else 'N/A'})\")\n\n    conv_results = doc_converter.convert_all(\n\
          \        input_pdfs,\n        raises_on_error=True,\n    )\n\n    # Process\
          \ the conversion results and insert embeddings into the vector database\n\
          \    process_and_insert_with_custom_chunking( conv_results=conv_results,\
          \  \n        vector_store_id=vector_store_id,  \n        embed_model_id=embed_model_id,\
          \  \n        max_tokens=512)\n\n"
        image: quay.io/balki404/docling-pipeline:0.0.7
        resources:
          cpuLimit: 4.0
          cpuRequest: 0.5
          memoryLimit: 6.442450944
          memoryRequest: 2.147483648
          resourceCpuLimit: '4'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 6Gi
          resourceMemoryRequest: 2Gi
    exec-import-test-pdfs:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - import_test_pdfs
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef import_test_pdfs(\n    base_url: str,\n    pdf_filenames: str,\n\
          \    output_path: dsl.OutputPath(\"input-pdfs\"),\n):\n    import os\n \
          \   import requests\n    import shutil\n\n    os.makedirs(output_path, exist_ok=True)\n\
          \    filenames = [f.strip() for f in pdf_filenames.split(\",\") if f.strip()]\n\
          \n    for filename in filenames:\n        url = f\"{base_url.rstrip('/')}/{filename.lstrip('/')}\"\
          \n        file_path = os.path.join(output_path, filename)\n\n        os.makedirs(os.path.dirname(file_path),\
          \ exist_ok=True)\n\n        try:\n            with requests.get(url, stream=True,\
          \ timeout=10) as response:\n                response.raise_for_status()\n\
          \                with open(file_path, \"wb\") as f:\n                  \
          \  shutil.copyfileobj(response.raw, f)\n            print(f\"Downloaded\
          \ {filename}\")\n        except requests.exceptions.RequestException as\
          \ e:\n            print(f\"Failed to download {filename}: {e}, skipping.\"\
          )\n\n"
        image: quay.io/balki404/docling-pipeline:0.0.7
    exec-register-vector-db:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_vector_db
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_vector_db(\n    service_url: str,\n    vector_db_id:\
          \ str,\n    embed_model_id: str,\n) -> str:\n    from llama_stack_client\
          \ import LlamaStackClient\n\n    client = LlamaStackClient(base_url=service_url)\n\
          \n    available = []\n    stack_model_id = None\n    embedding_dimension\
          \ = 768\n    for m in client.models.list():\n        md = m.custom_metadata\
          \ or {}\n        if md.get(\"model_type\") != \"embedding\":\n         \
          \   continue\n        provider_id = md.get(\"provider_resource_id\", \"\"\
          )\n        available.append(provider_id)\n        if provider_id == embed_model_id\
          \ or m.id.endswith(\"/\" + embed_model_id):\n            stack_model_id\
          \ = m.id\n            embedding_dimension = int(md.get(\"embedding_dimension\"\
          , 768))\n            break\n    if not stack_model_id:\n        raise ValueError(\n\
          \            f\"Model with ID '{embed_model_id}' not found on LlamaStack\
          \ server. \"\n            f\"Available embedding models: {available}\"\n\
          \        )\n\n    vector_store = client.vector_stores.create(\n        name=vector_db_id,\n\
          \        extra_body={\n            \"provider_id\": \"milvus-remote\",\n\
          \            \"embedding_model\": stack_model_id,\n            \"embedding_dimension\"\
          : embedding_dimension,\n        },\n    )\n    print(\n        f\"Created\
          \ vector store '{vector_db_id}' with embedding model '{stack_model_id}'\
          \ \"\n        f\"(vector store ID '{vector_store.id}').\"\n    )\n\n   \
          \ return vector_store.id\n\n"
        image: quay.io/balki404/docling-pipeline:0.0.7
pipelineInfo:
  description: Converts PDF documents in a git repository to Markdown using Docling
    and generates embeddings
  name: docling-convert-pipeline
root:
  dag:
    tasks:
      create-pdf-splits:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-create-pdf-splits
        dependentTasks:
        - import-test-pdfs
        inputs:
          artifacts:
            input_path:
              taskOutputArtifact:
                outputArtifactKey: output_path
                producerTask: import-test-pdfs
          parameters:
            num_splits:
              componentInputParameter: num_workers
        taskInfo:
          name: create-pdf-splits
      for-loop-1:
        componentRef:
          name: comp-for-loop-1
        dependentTasks:
        - create-pdf-splits
        - import-test-pdfs
        - register-vector-db
        inputs:
          artifacts:
            pipelinechannel--import-test-pdfs-output_path:
              taskOutputArtifact:
                outputArtifactKey: output_path
                producerTask: import-test-pdfs
          parameters:
            pipelinechannel--create-pdf-splits-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: create-pdf-splits
            pipelinechannel--embed_model_id:
              componentInputParameter: embed_model_id
            pipelinechannel--max_tokens:
              componentInputParameter: max_tokens
            pipelinechannel--register-vector-db-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: register-vector-db
            pipelinechannel--service_url:
              componentInputParameter: service_url
            pipelinechannel--use_gpu:
              componentInputParameter: use_gpu
        parameterIterator:
          itemInput: pipelinechannel--create-pdf-splits-Output-loop-item
          items:
            inputParameter: pipelinechannel--create-pdf-splits-Output
        taskInfo:
          name: for-loop-1
      import-test-pdfs:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-import-test-pdfs
        inputs:
          parameters:
            base_url:
              componentInputParameter: base_url
            pdf_filenames:
              componentInputParameter: pdf_filenames
        taskInfo:
          name: import-test-pdfs
      register-vector-db:
        cachingOptions: {}
        componentRef:
          name: comp-register-vector-db
        inputs:
          parameters:
            embed_model_id:
              componentInputParameter: embed_model_id
            service_url:
              componentInputParameter: service_url
            vector_db_id:
              componentInputParameter: vector_db_id
        taskInfo:
          name: register-vector-db
  inputDefinitions:
    parameters:
      base_url:
        defaultValue: https://raw.githubusercontent.com/bbalakriz/rh-kcs-mcp/master
        description: Base URL to fetch PDF files from
        isOptional: true
        parameterType: STRING
      embed_model_id:
        defaultValue: ibm-granite/granite-embedding-125m-english
        description: Model ID for embedding generation
        isOptional: true
        parameterType: STRING
      max_tokens:
        defaultValue: 512.0
        description: Maximum number of tokens per chunk
        isOptional: true
        parameterType: NUMBER_INTEGER
      num_workers:
        defaultValue: 1.0
        description: Number of docling worker pods to use
        isOptional: true
        parameterType: NUMBER_INTEGER
      pdf_filenames:
        defaultValue: SREIPS-Prod-troubleshooting-Knowledge-Base.pdf
        description: Comma-separated list of PDF filenames to download and convert
        isOptional: true
        parameterType: STRING
      service_url:
        defaultValue: http://lsd-llama-milvus-service:8321
        description: URL of the Milvus service
        isOptional: true
        parameterType: STRING
      use_gpu:
        defaultValue: false
        description: Enable GPU in the docling workers
        isOptional: true
        parameterType: BOOLEAN
      vector_db_id:
        defaultValue: sreips_vector_id
        description: ID of the vector database to store embeddings
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-docling-convert:
          nodeSelector:
            nodeSelectorJson:
              runtimeValue:
                constant: {}
          tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
