          parameterType: STRING
deploymentSpec:
  executors:
    exec-create-pdf-splits:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - create_pdf_splits
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef create_pdf_splits(\n    input_path: dsl.InputPath(\"input-pdfs\"\
          ),\n    num_splits: int,\n) -> List[List[str]]:\n    import pathlib\n\n\
          \    print(f\"Creating up to {num_splits} splits from PDFs in {input_path}\"\
          )\n    # Split our entire directory of pdfs into n batches, where n == num_splits\n\
          \    all_pdfs = [\n        str(path.relative_to(input_path))\n        for\
          \ path in pathlib.Path(input_path).rglob(\"*\")\n        if path.suffix.lower()\
          \ == \".pdf\"\n    ]\n\n    print(f\"Found PDFs for processing:\" , all_pdfs)\n\
          \n    splits = [\n        batch for batch in (all_pdfs[i::num_splits] for\
          \ i in range(num_splits)) if batch\n    ]\n    return splits or [[]]\n\n"
        image: quay.io/balki404/docling-pipeline:0.0.2
    exec-docling-convert:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - docling_convert
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'docling>=2.43.0'\
          \ 'transformers' 'sentence-transformers' 'llama-stack==0.3.1' 'llama-stack-client==0.3.1'\
          \ 'pymilvus' 'fire' 'rapidocr-onnxruntime' 'rapidocr' 'onnxruntime'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef docling_convert(\n    input_path: dsl.InputPath(\"input-pdfs\"\
          ),\n    pdf_split: List[str],\n    output_path: dsl.OutputPath(\"output-md\"\
          ),\n    embed_model_id: str,\n    max_tokens: int,\n    service_url: str,\n\
          \    vector_store_id: str,\n):\n    import pathlib  \n    import hashlib\
          \  \n    import json  \n    import logging  \n    from typing import List\
          \  \n\n    from docling.datamodel.base_models import InputFormat, ConversionStatus\
          \  \n    from docling.datamodel.pipeline_options import PdfPipelineOptions,\
          \ RapidOcrOptions  \n    from docling.document_converter import DocumentConverter,\
          \ PdfFormatOption  \n    from transformers import AutoTokenizer  \n    from\
          \ sentence_transformers import SentenceTransformer  \n    from docling.chunking\
          \ import HybridChunker  \n    from llama_stack_client import LlamaStackClient\
          \  \n    from llama_stack_client import RAGDocument  \n\n    _log = logging.getLogger(__name__)\
          \  \n\n    def setup_chunker_and_embedder(embed_model_id: str, max_tokens:\
          \ int):  \n        \"\"\"Initialize the custom chunker and embedding model\"\
          \"\"  \n        tokenizer = AutoTokenizer.from_pretrained(embed_model_id)\
          \  \n        embedding_model = SentenceTransformer(embed_model_id)  \n \
          \       chunker = HybridChunker(  \n            tokenizer=tokenizer, max_tokens=max_tokens,\
          \ merge_peers=True  \n        )  \n        return embedding_model, chunker\
          \  \n\n    def embed_text(text: str, embedding_model) -> List[float]:  \n\
          \        \"\"\"Generate embedding for text using the custom model\"\"\"\
          \  \n        return embedding_model.encode([text], normalize_embeddings=True).tolist()[0]\
          \  \n\n    def process_and_insert_with_custom_chunking(  \n        conv_results,\
          \   \n        vector_store_id: str,   \n        embed_model_id: str,  \n\
          \        max_tokens: int = 512  \n    ):  \n        \"\"\"Process documents\
          \ using custom chunker and embedding model\"\"\"  \n        processed_docs\
          \ = 0  \n\n        # Initialize custom chunker and embedder  \n        embedding_model,\
          \ chunker = setup_chunker_and_embedder(embed_model_id, max_tokens)  \n\n\
          \        for conv_res in conv_results:  \n            file_name = conv_res.input.file.stem\
          \  \n\n            if conv_res.status != ConversionStatus.SUCCESS:  \n \
          \               _log.warning(f\"Conversion failed for {file_name}: {conv_res.status}\"\
          )  \n                continue  \n\n            document = conv_res.document\
          \  \n            if document is None:  \n                _log.warning(f\"\
          Document conversion returned None for {file_name}\")  \n               \
          \ continue  \n\n            processed_docs += 1  \n\n            # Create\
          \ RAGDocuments from custom chunks  \n            rag_documents = []  \n\n\
          \            for chunk in chunker.chunk(dl_doc=document):  \n          \
          \      if chunk is None:  \n                    continue  \n\n         \
          \       raw_chunk = chunker.contextualize(chunk)  \n                if not\
          \ raw_chunk or not raw_chunk.strip():  \n                    continue  \n\
          \n                # Generate chunk_id from document + chunk text hash  \n\
          \                chunk_id = hashlib.sha256(f'{file_name}:{raw_chunk}'.encode()).hexdigest()\
          \  \n\n                # Create RAGDocument  \n                rag_doc =\
          \ RAGDocument(  \n                    document_id=chunk_id,  \n        \
          \            content=raw_chunk,  \n                    metadata={  \n  \
          \                      \"document_id\": file_name,  \n                 \
          \       \"file_name\": file_name,  \n                        \"chunk_id\"\
          : chunk_id,  \n                        \"source\": \"docling_hybrid_chunker\"\
          \  \n                    }  \n                )  \n                rag_documents.append(rag_doc)\
          \  \n\n            # Insert using the tool runtime API  \n            if\
          \ rag_documents:  \n                try:  \n                    client =\
          \ LlamaStackClient(base_url=service_url)    \n                    client.tool_runtime.rag_tool.insert(\
          \  \n                        documents=rag_documents,  \n              \
          \          vector_db_id=vector_store_id,  \n                        chunk_size_in_tokens=max_tokens\
          \  \n                    )  \n                    _log.info(f\"Inserted\
          \ {len(rag_documents)} chunks for {file_name}\")  \n                except\
          \ Exception as e:  \n                    _log.error(f\"Failed to insert\
          \ chunks for {file_name}: {e}\")  \n\n        _log.info(f\"Processed {processed_docs}\
          \ documents successfully.\") \n\n    # Main logic starts here\n    input_path\
          \ = pathlib.Path(input_path)\n    output_path = pathlib.Path(output_path)\n\
          \    output_path.mkdir(parents=True, exist_ok=True)\n\n    # Build absolute\
          \ paths for the PDFs\n    input_pdfs = list(input_path.rglob(\"*.pdf\"))\n\
          \n    # Ensure only valid, non-empty PDFs are kept\n    input_pdfs = [p\
          \ for p in input_pdfs if p.exists() and p.stat().st_size > 0]\n\n    if\
          \ not input_pdfs:\n        raise RuntimeError(\"No valid PDFs found in input_path\
          \ for processing.\")\n\n    # Required models are automatically downloaded\
          \ when they are\n    # not provided in PdfPipelineOptions initialization\n\
          \    pipeline_options = PdfPipelineOptions()\n    pipeline_options.do_ocr\
          \ = True\n    pipeline_options.generate_page_images = True\n    pipeline_options.ocr_options\
          \ = RapidOcrOptions()\n\n    doc_converter = DocumentConverter(\n      \
          \  format_options={\n            InputFormat.PDF: PdfFormatOption(pipeline_options=pipeline_options)\n\
          \        }\n    )\n\n    print(\"PDFs for conversion:\")\n    for p in input_pdfs:\n\
          \        print(f\" - {p} (exists={p.exists()}, size={p.stat().st_size if\
          \ p.exists() else 'N/A'})\")\n\n    conv_results = doc_converter.convert_all(\n\
          \        input_pdfs,\n        raises_on_error=True,\n    )\n\n    # Process\
          \ the conversion results and insert embeddings into the vector database\n\
          \    process_and_insert_with_custom_chunking( conv_results=conv_results,\
          \  \n        vector_store_id=vector_store_id,  \n        embed_model_id=embed_model_id,\
          \  \n        max_tokens=512)\n\n"
        image: quay.io/balki404/docling-pipeline:0.0.2
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
            resourceType: nvidia.com/gpu
            type: nvidia.com/gpu
          cpuLimit: 4.0
          cpuRequest: 0.5
          memoryLimit: 6.442450944
          memoryRequest: 2.147483648
          resourceCpuLimit: '4'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 6Gi
          resourceMemoryRequest: 2Gi
    exec-docling-convert-2:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - docling_convert
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'docling>=2.43.0'\
          \ 'transformers' 'sentence-transformers' 'llama-stack==0.3.1' 'llama-stack-client==0.3.1'\
          \ 'pymilvus' 'fire' 'rapidocr-onnxruntime' 'rapidocr' 'onnxruntime'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef docling_convert(\n    input_path: dsl.InputPath(\"input-pdfs\"\
