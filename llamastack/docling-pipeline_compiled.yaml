          \ PdfFormatOption  \n    from transformers import AutoTokenizer  \n    from\
          \ sentence_transformers import SentenceTransformer  \n    from docling.chunking\
          \ import HybridChunker  \n    from llama_stack_client import LlamaStackClient\
          \  \n    from llama_stack_client import RAGDocument  \n\n    _log = logging.getLogger(__name__)\
          \  \n\n    def setup_chunker_and_embedder(embed_model_id: str, max_tokens:\
          \ int):  \n        \"\"\"Initialize the custom chunker and embedding model\"\
          \"\"  \n        tokenizer = AutoTokenizer.from_pretrained(embed_model_id)\
          \  \n        embedding_model = SentenceTransformer(embed_model_id)  \n \
          \       chunker = HybridChunker(  \n            tokenizer=tokenizer, max_tokens=max_tokens,\
          \ merge_peers=True  \n        )  \n        return embedding_model, chunker\
          \  \n\n    def embed_text(text: str, embedding_model) -> List[float]:  \n\
          \        \"\"\"Generate embedding for text using the custom model\"\"\"\
          \  \n        return embedding_model.encode([text], normalize_embeddings=True).tolist()[0]\
          \  \n\n    def process_and_insert_with_custom_chunking(  \n        conv_results,\
          \   \n        vector_store_id: str,   \n        embed_model_id: str,  \n\
          \        max_tokens: int = 512  \n    ):  \n        \"\"\"Process documents\
          \ using custom chunker and embedding model\"\"\"  \n        processed_docs\
          \ = 0  \n\n        # Initialize custom chunker and embedder  \n        embedding_model,\
          \ chunker = setup_chunker_and_embedder(embed_model_id, max_tokens)  \n\n\
          \        for conv_res in conv_results:  \n            file_name = conv_res.input.file.stem\
          \  \n\n            if conv_res.status != ConversionStatus.SUCCESS:  \n \
          \               _log.warning(f\"Conversion failed for {file_name}: {conv_res.status}\"\
          )  \n                continue  \n\n            document = conv_res.document\
          \  \n            if document is None:  \n                _log.warning(f\"\
          Document conversion returned None for {file_name}\")  \n               \
          \ continue  \n\n            processed_docs += 1  \n\n            # Create\
