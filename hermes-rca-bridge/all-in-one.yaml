# ConfigMap hermes-rca-bridge-config and Secret hermes-rca-bridge-secret are created by bootstrap.sh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-rca-bridge
  namespace: hermes-agent
  labels:
    app: hermes-rca-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-rca-bridge
  template:
    metadata:
      labels:
        app: hermes-rca-bridge
    spec:
      containers:
        - name: hermes-rca-bridge
          image: quay.io/balki404/sreips-hermes-rca-bridge:0.0.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: HERMES_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hermes-rca-bridge-config
                  key: HERMES_BASE_URL
            - name: HERMES_MODEL
              valueFrom:
                configMapKeyRef:
                  name: hermes-rca-bridge-config
                  key: HERMES_MODEL
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: hermes-rca-bridge-config
                  key: CLUSTER_NAME
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-rca-bridge-secret
                  key: HERMES_API_KEY
                  optional: true
            - name: HERMES_TIMEOUT_SEC
              value: "600"
            - name: LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-rca-bridge
  namespace: hermes-agent
spec:
  selector:
    app: hermes-rca-bridge
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hermes-rca-bridge
  namespace: hermes-agent
spec:
  to:
    kind: Service
    name: hermes-rca-bridge
  port:
    targetPort: 8000
  tls:
    termination: edge
