apiVersion: v1
kind: Secret
metadata:
  name: redhat-api-token
type: Opaque
stringData:
  RH_API_OFFLINE_TOKEN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redhat-api-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redhat-api-mcp
  template:
    metadata:
      labels:
        app: redhat-api-mcp
    spec:
      containers:
        - name: mcp
          image: quay.io/balki404/rh-kcs-mcp:0.0.8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: RH_API_OFFLINE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: redhat-api-token
                  key: RH_API_OFFLINE_TOKEN
            # Set to "offline" for air-gapped deployments.
            # When offline, RH_API_OFFLINE_TOKEN is not used.
            - name: KCS_MODE
              value: "offline"
            # Required when KCS_MODE=offline
            - name: LLAMA_STACK_URL
              value: ""
            - name: KCS_VECTOR_DB_ID
              value: "kcs_vector_id"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redhat-api-mcp
spec:
  selector:
    app: redhat-api-mcp
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    openshift.io/host.generated: "true"
  name: rh-kcs
spec:
  path: /
  port:
    targetPort: 8000
  tls:
    termination: edge
  to:
    kind: Service
    name: redhat-api-mcp
    weight: 100
  wildcardPolicy: None


